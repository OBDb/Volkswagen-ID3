generations:
  - name: "First Generation (Original)"
    start_year: 2020
    end_year: 2023
    description: "The Volkswagen ID.3 represents a pivotal model in Volkswagen's transition toward electrification, being the first vehicle built on the company's dedicated MEB (Modular Electric Drive Matrix) platform developed specifically for electric vehicles. Featuring distinctive styling that balances futuristic elements with familiar Volkswagen design language, the ID.3 adopts a compact hatchback silhouette with short overhangs, a long wheelbase relative to its overall length, and various aerodynamic optimizations contributing to a drag coefficient of 0.267. The ID.3 is powered by a rear-mounted APP 310 electric motor driving the rear wheels—a layout that harkens back to the original Beetle while offering packaging advantages for a compact EV—with power outputs ranging from 148 to 204 horsepower depending on variant. Battery capacity options include 45 kWh (Pure Performance), 58 kWh (Pro/Pro Performance), and 77 kWh (Pro S) packs. The interior features a minimalist, open design made possible by the flat floor and absence of a traditional transmission tunnel, with a 10-inch central touchscreen, compact digital instrument display, and optional augmented reality head-up display. Most physical buttons are replaced by touch-sensitive controls, with voice commands providing additional interaction options. At launch, the ID.3 was available in three launch trim levels: 1st, 1st Plus, and 1st Max."

  - name: "First Generation (Facelift)"
    start_year: 2023
    end_year: null
    description: "In March 2023, Volkswagen released a refreshed version of the ID.3 with significant updates. The facelift features a slightly redesigned front bumper and air intakes, as well as improved interior material quality addressing previous criticisms. The high-performance GTX variant was introduced in 2024, featuring an upgraded APP 550 motor with output of 210 kW (286 PS) in standard form and 240 kW (326 PS) in Performance guise. The GTX models also receive a larger 79 kWh battery (84 kWh gross) with improved DC charging up to 175 kW. Other updates include enhanced battery capacity for the Pro S model and continued production at both Zwickau and Dresden factories. The facelift model was launched in Australasia in mid-2024 alongside other ID series models."