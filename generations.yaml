generations:
  - name: "First Generation"
    start_year: 2020
    end_year: null
    description: "The Volkswagen ID.3 represents a pivotal model in Volkswagen's transition toward electrification, being the first vehicle built on the company's dedicated MEB (Modular Electric Drive Matrix) platform developed specifically for electric vehicles. Featuring distinctive styling that balances futuristic elements with familiar Volkswagen design language, the ID.3 adopts a compact hatchback silhouette with short overhangs, a long wheelbase relative to its overall length, and various aerodynamic optimizations contributing to a drag coefficient of 0.27. The ID.3 is powered by a rear-mounted electric motor driving the rear wheels—a layout that harkens back to the original Beetle while offering packaging advantages for a compact EV—with power outputs ranging from 148 to 201 horsepower depending on variant. Battery capacity options include 45 kWh (Pure), 58 kWh (Pro), and 77 kWh (Pro S) packs, providing WLTP-rated ranges of approximately 217, 264, and 341 miles respectively, with DC fast charging capabilities of up to 100-135 kW depending on battery size, enabling an 80% charge in approximately 30 minutes under ideal conditions. The interior features a minimalist, open design made possible by the flat floor and absence of a traditional transmission tunnel, with a 10-inch (or optional 12-inch) central touchscreen, compact digital instrument display, and optional augmented reality head-up display handling most interface functions. Most physical buttons are replaced by touch-sensitive controls, with voice commands providing additional interaction options. The ID.3 offers interior space comparable to a Passat within a Golf-sized footprint, demonstrating the packaging advantages of the purpose-built electric platform. Advanced driver assistance systems include Travel Assist for partially automated driving, emergency braking, and lane keeping functionality. A significant update in 2023 brought design refinements including higher-quality interior materials addressing early criticism, enhanced software, and improved charging functionality. The ID.3 serves as Volkswagen's answer to mainstream electric vehicles like the Tesla Model 3 and Nissan Leaf, positioned as an accessible, practical electric car for everyday use rather than a premium offering, representing the first step in Volkswagen's ambitious ID family of electric vehicles aimed at bringing EVs to the mass market."
